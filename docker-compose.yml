services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial_rag_app
    ports:
      - "8501:8501"
    environment:
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - hf_cache:/app/.cache/huggingface
      - ./data:/app/data
      - qdrant_data:/app/data/qdrant
      - ./src:/app/src
      - ./models:/app/models
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: financial_qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  hf_cache:
  qdrant_data: